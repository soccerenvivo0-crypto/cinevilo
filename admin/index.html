<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINEVILO ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#101218;border-bottom:1px solid #242630;display:flex;align-items:center;padding:0 25px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#2563ff}
.layout{display:flex;min-height:calc(100vh - 70px)}
nav{width:220px;background:#101218;padding:20px 10px;border-right:1px solid #242630}
nav button{width:100%;padding:13px;margin-bottom:5px;text-align:left;background:transparent;color:#aaa;border:0;border-radius:7px;cursor:pointer}
nav button.active,nav button:hover{background:#2563ff;color:#fff}
main{flex:1;padding:30px;max-width:1000px}
h1{margin-top:0}.card{background:#101218;border:1px solid #242630;border-radius:12px;padding:25px}
label{display:block;margin:15px 0 6px;color:#aaa}
input,select{width:100%;padding:12px;background:#08090d;border:1px solid #333;border-radius:7px;color:#fff}
button.save{margin-top:20px;padding:13px 25px;background:#2563ff;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
#estado{margin-top:15px;padding:12px;border-radius:7px}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="logo">CINE<span>VILO</span> ADMIN</div></header>

<div class="layout">
<nav>
<button class="active">Dashboard</button>
<button>Contenido</button>
<button>Series</button>
<button>Destacados</button>
<button>CINEVILO ORIGINALS</button>
<button>EN VIVO</button>
<button>Usuarios</button>
<button>Estadísticas</button>
<button>Configuración</button>
</nav>

<main>
<section id="envivo">
<h1>EN VIVO</h1>
<div class="card">
<label>Título</label>
<input id="titulo" value="CINEVILO EN VIVO">

<label>Modo</label>
<select id="modo">
<option value="rtmp">RTMP</option>
<option value="link">LINK</option>
</select>

<label>URL HLS</label>
<input id="url" placeholder="http://93.189.90.20:8888/cinevilo/index.m3u8">

<label>URL RTMP</label>
<input id="rtmpUrl" placeholder="rtmp://93.189.90.20">

<label>Clave RTMP</label>
<input id="rtmpClave" placeholder="cinevilo">

<label>
<input id="activo" type="checkbox" style="width:auto">
 Transmisión activa
</label>

<button class="save" onclick="guardar()">GUARDAR TRANSMISIÓN</button>
<div id="estado"></div>
</div>
</section>
</main>
</div>

<script>
const API="https://cinevilo-api.soccerenvivo0.workers.dev/api/en-vivo";

async function cargar(){
 try{
  const r=await fetch(API);
  const datos=await r.json();
  const x=datos.find(v=>Number(v.activo)===1)||datos[0];
  if(!x)return;
  document.getElementById("titulo").value=x.titulo||"";
  document.getElementById("modo").value=x.modo||"rtmp";
  document.getElementById("url").value=x.url||"";
  document.getElementById("rtmpUrl").value=x.rtmpUrl||"";
  document.getElementById("rtmpClave").value=x.rtmpClave||"";
  document.getElementById("activo").checked=Number(x.activo)===1;
  estado.textContent="✓ Configuración cargada desde CINEVILO.";
 }catch(e){estado.textContent="Error cargando: "+e.message}
}

async function guardar(){
 const datos={
  titulo:document.getElementById("titulo").value,
  modo:document.getElementById("modo").value,
  url:document.getElementById("url").value,
  rtmpUrl:document.getElementById("rtmpUrl").value,
  rtmpClave:document.getElementById("rtmpClave").value,
  activo:document.getElementById("activo").checked?1:0
 };
 try{
  const r=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(datos)
  });
  const t=await r.text();
  if(!r.ok)throw new Error(t);
  estado.textContent="✓ TRANSMISIÓN GUARDADA";
  cargar();
 }catch(e){estado.textContent="Error guardando: "+e.message}
}

cargar();
</script>
</body>
</html>
